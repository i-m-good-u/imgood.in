name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: tar -czf site.tar.gz -C dist .

      - name: Check secrets are present
        run: |
          ok=true
          [ -n "${{ secrets.SSH_HOST }}" ] && echo "SSH_HOST: set" || { echo "SSH_HOST: MISSING"; ok=false; }
          [ -n "${{ secrets.SSH_PORT }}" ] && echo "SSH_PORT: set" || { echo "SSH_PORT: MISSING"; ok=false; }
          [ -n "${{ secrets.SSH_USER }}" ] && echo "SSH_USER: set" || { echo "SSH_USER: MISSING"; ok=false; }
          [ -n "${{ secrets.SSH_PASSWORD }}" ] && echo "SSH_PASSWORD: set" || { echo "SSH_PASSWORD: MISSING"; ok=false; }
          $ok || { echo "Add the missing secrets at Settings → Secrets and variables → Actions → Repository secrets"; exit 1; }

      - name: Upload bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: site.tar.gz
          target: /home/${{ secrets.SSH_USER }}/

      - name: Extract into web root
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            DOCROOT=~/domains/imgood.in/public_html
            tar -xzf ~/site.tar.gz -C "$DOCROOT"
            rm ~/site.tar.gz
            find "$DOCROOT/assets" -type f -mtime +30 -delete 2>/dev/null || true
            echo "deployed $(date)"
